# フェーズ1 collector 設定ファイル
#
# 記載しなかった項目はコード側の既定値が使われる（crates/config/src/lib.rs）。
#
# 対象 DEX は Hyperliquid + Lighter の 2 つ。ファンディング精算間隔を揃える
# （両者とも 1 時間）ことを優先したため、edgeX / Aster は一時無効化している。
# **コードは残してあり、テストも回り続ける。** 再開は enabled = true だけでよい。

[general]
symbols = ["BTC", "ETH", "SOL", "HYPE"]
orderbook_depth = 20
# VWAP ベース乖離を計算する際の想定ノーショナル（USD）。0 で無効。
vwap_notional_usd = 1000
book_channel_capacity = 4096

[dex.hyperliquid]
enabled = true
ws_url = "wss://api.hyperliquid.xyz/ws"
reconnect_max_attempts = 10
reconnect_base_delay_ms = 500
reconnect_max_delay_ms = 30000
# 無通信が続くと取引所側から切断されるため必須
ping_interval_secs = 30
excluded_symbols = []

[dex.edgex]
# 一時無効化。精算間隔を一次情報で確認してから再開する
enabled = false
ws_url = "wss://edgex-quote-prod-v2.edgex.exchange/api/v1/public/ws"
reconnect_max_attempts = 10
reconnect_base_delay_ms = 500
reconnect_max_delay_ms = 30000
ping_interval_secs = 20
# depth チャネルのレベル数（API 側で離散値に制限される）
depth_level = 15
# 差分再構築のズレ検出のため定期的に再購読してスナップショットを取り直す（秒, 0 で無効）
resync_interval_secs = 300
# 起動時に REST メタデータから contractId を解決する
resolve_contract_ids = true
metadata_url = "https://pro.edgex.exchange/api/v1/public/meta/getMetaData"
excluded_symbols = []
# 自動解決に失敗した場合のフォールバック（手動指定は常に優先される）。
# 実際の contractId を確認して埋めること。
# サブテーブルなので、この [dex.edgex] セクションの最後に置くこと。
# [dex.edgex.contract_ids]
# BTC = "10000001"
# ETH = "10000002"
# SOL = "10000003"
# HYPE = "10000004"

[dex.aster]
# 一時無効化。8 時間精算のため、有効化する際は年率換算での比較が必須
enabled = false
ws_url = "wss://fstream.asterdex.com"
# Spot 用の sapi ではなく Futures/Perp 用の fapi を使う
rest_url = "https://fapi.asterdex.com"
# depth ストリームの更新間隔（空文字なら既定速度の <symbol>@depth）
depth_stream_interval = "100ms"
snapshot_limit = 1000
# 24 時間の強制切断を待たずに能動的に張り直す（0 で無効）
reconnect_before_hours = 23
reconnect_max_attempts = 10
reconnect_base_delay_ms = 500
reconnect_max_delay_ms = 30000
# 板再初期化（REST スナップショット再取得）の最小間隔。IP ban 回避のため必ず効かせる
resync_backoff_ms = 5000
excluded_symbols = []

[dex.lighter]
enabled = true
ws_url = "wss://mainnet.zklighter.elliot.ai/stream"
testnet_ws_url = "wss://testnet.zklighter.elliot.ai/stream"
use_testnet = false
# フェーズ1 では REST を使わない（板・シンボルマッピングとも WS で完結）
# クライアント側が 2 分に 1 回以上フレームを送る責任があるため余裕を持たせる
keepalive_interval_secs = 60
reconnect_max_attempts = 10
reconnect_base_delay_ms = 500
reconnect_max_delay_ms = 30000
# market_stats から market_index を解決できないまま経過したら警告する
mapping_warn_secs = 30
excluded_symbols = []

[recording]
csv_dir = "data"
log_dir = "logs"
# all | sampled | threshold
# フェーズ1 は全件記録で開始し、ファイルサイズを見てから調整する
csv_mode = "all"
csv_sample_interval_ms = 100
csv_threshold_bps = 5
csv_flush_interval_ms = 1000
snapshot_channel_capacity = 8192
log_filter = "info"
log_to_stdout = false

[monitoring]
latency_warn_threshold_ms = 500
staleness_warn_threshold_ms = 1000
status_interval_secs = 60
warn_min_interval_secs = 10

# ---------------------------------------------------------------------------
# 戦略（フェーズ2 で使う。フェーズ1 の collector はシグナルを出さない）
# ---------------------------------------------------------------------------

[strategy.price_arb]
enabled = true
# 実質乖離がこれを下回るシグナルは出さない
min_profit_bps = 1.0
safety_buffer_bps = 2.0
notional_usd = 1000
# 板の鮮度差がこれを超えるペアは判定しない（見かけ上の乖離を弾く）
max_staleness_delta_ms = 250
# true なら想定サイズの VWAP ベースで判定する（スリッページは織り込み済み）
use_vwap = true
assumed_slippage_bps = 2.0
# 建て + 決済の 4 レグ分の手数料を引く
count_exit_fees = true
entry_style = "taker"
exit_style = "taker"

[strategy.funding_arb]
enabled = true
# 1 精算あたりのレート差がこれ未満ならシグナルを出さない
min_rate_diff_bps = 1.0
# 1 精算あたりの純収益の下限
min_profit_bps = 0.5
safety_buffer_bps = 0.5
# 想定保有精算回数（1 時間精算なら 12 = 12 時間）
expected_intervals = 12
# 手数料回収に必要な精算回数がこれを超えたら棄却
max_acceptable_breakeven_intervals = 6
# これ以上不利なベーシス（価格差）では建てない
max_adverse_basis_bps = 2.0
# 有利なベーシスを期待収益に加算するか。既定 false（収束を当てにしない）
count_favorable_basis = false
per_position_max_pct = 0.10
max_concurrent_positions = 4
max_holding_hours = 72
notional_usd = 1000
# 精算間隔が異なる DEX 同士のペアを許可するか（Aster 有効化時に要検討）
allow_mismatched_intervals = false
entry_style = "maker"
exit_style = "taker"

# ---------------------------------------------------------------------------
# 資金配分とキルスイッチ
# ---------------------------------------------------------------------------

[allocation]
# 各 DEX の証拠金プールに対する配分比率。合計が 1.0 を超えないこと
price_arb_pct = 0.30
funding_arb_pct = 0.40
# どちらの戦略も使えない緊急クローズ専用の余力
reserve_pct = 0.30

[killswitch]
# 戦略ごとに独立して停止できる
price_arb_daily_loss_limit_pct = 2.0
funding_arb_daily_loss_limit_pct = 2.0
# Bot 全体（両戦略を停止）
global_daily_loss_limit_pct = 3.0

# ---------------------------------------------------------------------------
# 手数料率（bps）
# ---------------------------------------------------------------------------
# **既定値は持たせていない。** 未設定の DEX を含むペアは、戦略側でシグナルを
# 出さずにスキップされる（確認前の値で利益判定が通らないようにするため）。
# 一次情報で確認してからコメントを外すこと。
#
# [fees.hyperliquid]
# taker_bps = 4.5
# maker_bps = 1.5
#
# [fees.lighter]
# taker_bps = 2.0
# maker_bps = 0.0
